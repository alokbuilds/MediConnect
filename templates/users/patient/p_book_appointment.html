{% extends "users/patient/p_base.html" %}
{% block title %}Book Appointment{% endblock %}

{% block content %}

<div class="page-container">

    <!-- Title -->
    <h4 class="fw-bold mb-4">
        <i class="bi bi-calendar-check me-2"></i>
        Book Appointment
    </h4>

    <!-- Messages -->
    {% if messages %}
        <div class="message-container">
            {% for message in messages %}
            <div class="message mb-3 
                {% if message.tags == 'success' %}message-success
                {% elif message.tags == 'error' %}message-error
                {% elif message.tags == 'warning' %}message-warning
                {% elif message.tags == 'info' %}message-info
                {% endif %}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
    {% endif %}

    <!-- Card Start -->
    <div class="appointment-card">

        <form method="POST">
            {% csrf_token %}

            <div class="row g-3">

                <!-- Doctor -->
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Doctor</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-person-badge"></i>
                        </span>
                        <select name="doctor" class="form-select" required>
                            <option value="">-- Select Doctor --</option>
                            {% for d in doctors %}
                                <option value="{{ d.id }}">
                                    {{ d.user.first_name }} {{ d.user.last_name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <!-- Date -->
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Appointment Date</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-calendar"></i>
                        </span>
                        <input type="date"
                               name="appointment_date"
                               min="{{ today_date }}"
                               max="{{ max_date }}"
                               class="form-control"
                               required>
                    </div>
                </div>

                <!-- Time -->
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Time Slot</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-clock"></i>
                        </span>
                        <select name="appointment_time"
                                id="id_appointment_time"
                                class="form-select"
                                required>
                            <option value="">-- Select Time Slot --</option>

                            <option value="09:00">09:00 AM</option>
                            <option value="09:30">09:30 AM</option>
                            <option value="10:00">10:00 AM</option>
                            <option value="10:30">10:30 AM</option>
                            <option value="11:00">11:00 AM</option>
                            <option value="11:30">11:30 AM</option>
                            <option value="12:00">12:00 PM</option>
                            <option value="12:30">12:30 PM</option>
                            <option value="13:00">01:00 PM</option>
                            <option value="13:30">01:30 PM</option>
                            <option value="16:00">04:00 PM</option>
                            <option value="16:30">04:30 PM</option>
                            <option value="17:00">05:00 PM</option>
                            <option value="17:30">05:30 PM</option>
                            <option value="18:00">06:00 PM</option>

                        </select>
                    </div>
                </div>

                <!-- Submit -->
                <div class="col-12 mt-3">
                    <button type="submit" class="btn btn-primary w-100 btn-book">
                        <i class="bi bi-check-circle me-1"></i>
                        Confirm Appointment
                    </button>
                </div>

            </div>

        </form>

    </div>
    <!-- Card End -->

</div>

{% endblock %}
