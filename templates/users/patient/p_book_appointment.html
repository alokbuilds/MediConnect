{% extends "users/patient/p_base.html" %}
{% block title %}Book Appointment{% endblock %}

{% block content %}

<div class="page-container">

    <!-- Title -->
    <h4 class="fw-bold mb-4">
        <i class="bi bi-calendar-check me-2"></i>
        Book Appointment
    </h4>

    <!-- Messages -->
    {% if messages %}
        <div class="message-container">
            {% for message in messages %}
            <div class="message mb-3 
                {% if message.tags == 'success' %}message-success
                {% elif message.tags == 'error' %}message-error
                {% elif message.tags == 'warning' %}message-warning
                {% elif message.tags == 'info' %}message-info
                {% endif %}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
    {% endif %}

    <!-- Card Start -->
    <div class="appointment-card">

        <form method="POST">
            {% csrf_token %}

            <div class="row g-3">

                <!-- Doctor -->
                <div class="col-md-6">
                    <label class="form-label fw-semibold" for="id_doctor">Doctor</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-person-badge"></i>
                        </span>
                        <select name="doctor" class="form-select" id="id_doctor"
                           onchange="showAvailability(this.value)" required>
                            <option value="">-- Select Doctor --</option>

                            {% for d in doctors %}
                                <option value="{{ d.id }}"
                                    {% if selected_doctor_id == d.id|stringformat:"s" %}
                                        selected
                                    {% endif %}
                                >
                                    Dr. {{ d.user.first_name }} {{ d.user.last_name }} - {{ d.specialization|truncatechars:20 }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <!-- Doctor Availability -->
                <div class="col-md-6">
                    <h6>Doctor Availability</h6>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-calendar-check"></i>
                        </span>
                        <div id="availabilityBox" class="form-control"></div>
                    </div>
                </div>

                <!-- Date -->
                <div class="col-md-6">
                    <label class="form-label fw-semibold" for="id_appointment_date">Appointment Date</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-calendar"></i>
                        </span>
                        <input type="date"
                               name="appointment_date"
                               id="id_appointment_date"
                               min="{{ today_date }}"
                               max="{{ max_date }}"
                               class="form-control"
                               required>
                    </div>
                </div>

                <!-- Time -->
                <div class="col-md-12">
                    <label class="form-label fw-semibold">Select Time Slot</label>

                    <input type="hidden" name="appointment_time" id="selectedTime">

                    <div id="slotContainer" class="d-flex flex-wrap gap-2"></div>
                </div>

                <!-- Submit -->
                <div class="col-12 mt-3">
                    <button type="submit" class="btn btn-primary w-100 btn-book">
                        <i class="bi bi-check-circle me-1"></i>
                        Confirm Appointment
                    </button>
                </div>

            </div>

        </form>

    </div>
    <!-- Card End -->

</div>
<script>
const availabilityData = {{ availability_data|safe }};

// 🔥 Time convert function (24hr → AM/PM)
function formatTime(timeStr) {
    let [hour, minute] = timeStr.split(":");

    hour = parseInt(hour);

    let ampm = hour >= 12 ? "PM" : "AM";
    hour = hour % 12 || 12;

    return `${hour.toString().padStart(2, '0')}:${minute} ${ampm}`;
}

function showAvailability(doctorId) {
    const box = document.getElementById("availabilityBox");
    box.innerHTML = "";

    if (!doctorId || !availabilityData[doctorId] || availabilityData[doctorId].length === 0) {
        box.innerHTML = "<p class='text-muted mb-0'>No availability found</p>";
        return;
    }

    let html = `
        <div class="card p-3 mt-2">
            <h6 class="mb-2">Doctor Availability</h6>
    `;

    availabilityData[doctorId].forEach(a => {
        html += `
            <p class="mb-1">
                ${a.day.charAt(0).toUpperCase() + a.day.slice(1)}: 
                ${formatTime(a.start)} - ${formatTime(a.end)}
            </p>
        `;
    });

    html += "</div>";

    box.innerHTML = html;
}

// Auto load
window.onload = function() {
    const selected = "{{ selected_doctor_id }}";
    if (selected) {
        showAvailability(selected);
    }
}


// All slots
const allSlots = [
    "09:00","09:30","10:00","10:30",
    "11:00","11:30","12:00","12:30",
    "13:00","13:30",
    "16:00","16:30","17:00","17:30","18:00"
];

// Convert AM/PM
function formatTime(timeStr) {
    let [hour, minute] = timeStr.split(":");
    hour = parseInt(hour);
    let ampm = hour >= 12 ? "PM" : "AM";
    hour = hour % 12 || 12;
    return `${hour}:${minute} ${ampm}`;
}

// Render slots
function renderSlots() {
    const container = document.getElementById("slotContainer");
    container.innerHTML = "";

    allSlots.forEach(slot => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "slot-btn btn btn-outline-primary";
        btn.innerText = formatTime(slot);

        btn.onclick = function () {
            document.getElementById("selectedTime").value = slot;

            document.querySelectorAll(".slot-btn").forEach(b => {
                b.classList.remove("active");
            });

            btn.classList.add("active");
        };

        container.appendChild(btn);
    });
}

// load on start
window.onload = function () {
    renderSlots();
};
</script>
{% endblock %}
